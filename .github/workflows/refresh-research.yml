name: Refresh research datasets
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 3 * *'
permissions:
  contents: read
concurrency:
  group: research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/download-research.py "$RUNNER_TEMP/policycraft-data"
      - run: python scripts/prepare-research-refresh.py "$RUNNER_TEMP/policycraft-data"
      - run: python scripts/prepare-extra-refresh.py "$RUNNER_TEMP/policycraft-data"
      - run: node scripts/publish-research-refresh.mjs "$RUNNER_TEMP/policycraft-data"
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
          POLICYCRAFT_SERVICE_EMAIL: ${{ secrets.POLICYCRAFT_SERVICE_EMAIL }}
          POLICYCRAFT_SERVICE_PASSWORD: ${{ secrets.POLICYCRAFT_SERVICE_PASSWORD }}
          POLICYCRAFT_SERVICE_UID: ${{ secrets.POLICYCRAFT_SERVICE_UID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-refresh-measurements
          path: ${{ runner.temp }}/policycraft-data/extended-staging-report.json
          if-no-files-found: ignore
          retention-days: 90
